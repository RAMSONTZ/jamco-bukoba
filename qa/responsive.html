<!doctype html><html><meta charset="utf-8"><title>JAMCO responsive QA</title><style>body{margin:0;background:#333;font:16px sans-serif;color:white}header{padding:12px;display:flex;gap:16px;align-items:center}select,a{font:inherit;color:white;background:#222;padding:8px;border:1px solid #666}iframe{display:block;border:0;width:390px;height:870px;margin:0 20px;background:#0b0c0e}label{display:flex;gap:10px;align-items:center}</style><header><label>Screen width<select id="width"><option>320</option><option>375</option><option selected>390</option><option>430</option><option>768</option><option>1366</option></select></label><label>Page<select id="path"><option value="/">Feed</option><option value="/gundua">Discovery</option><option value="/akaunti">Account</option><option value="/shiriki">Submit</option><option value="/admin">Admin</option></select></label><span id="result"></span></header><iframe id="frame" src="/" title="JAMCO responsive application"></iframe><script>const w=document.querySelector('#width'),p=document.querySelector('#path'),f=document.querySelector('iframe');w.onchange=()=>f.style.width=w.value+'px';p.onchange=()=>f.src=p.value;f.onload=()=>document.querySelector('#result').textContent='Loaded';</script></html>
